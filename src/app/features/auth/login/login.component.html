<div class="auth-page">
  <!-- Background decorations -->
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>

  <div class="auth-card card">
    <div class="auth-header">
      <div class="auth-logo">🌐</div>
      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-subtitle">Sign in to ConnectSphere</p>
    </div>

    @if (error) {
      <div class="alert-box error-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        {{ error }}
      </div>
    }

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form">
      <div class="field-group">
        <label for="email">Email or Username</label>
        <div class="input-wrap">
          <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          <input id="email" type="text" formControlName="email" placeholder="you@example.com">
        </div>
      </div>

      <div class="field-group">
        <label for="password">Password</label>
        <div class="input-wrap">
          <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
          <input id="password" type="password" formControlName="password" placeholder="Your password">
        </div>
      </div>

      <button type="submit" class="btn-primary submit-btn" [disabled]="loading || loginForm.invalid">
        @if (loading) {
          <span class="spinner"></span> Signing in…
        } @else {
          Sign In
        }
      </button>
    </form>

    <div class="auth-footer">
      Don't have an account? <a routerLink="/register" class="auth-link">Create account</a>
    </div>
  </div>
</div>
