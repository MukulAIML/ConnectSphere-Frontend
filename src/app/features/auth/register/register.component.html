<div class="auth-page">
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>

  <div class="auth-card card">
    <div class="auth-header">
      <div class="auth-logo">🌐</div>
      <h1 class="auth-title">Create Account</h1>
      <p class="auth-subtitle">Join ConnectSphere today</p>
    </div>

    @if (error) {
      <div class="alert-box error-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        {{ error }}
      </div>
    }

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="auth-form">
      <div class="field-group">
        <label for="fullName">Full Name</label>
        <div class="input-wrap">
          <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <input id="fullName" type="text" formControlName="fullName" placeholder="John Doe">
        </div>
      </div>

      <div class="field-group">
        <label for="username">Username</label>
        <div class="input-wrap">
          <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <input id="username" type="text" formControlName="username" placeholder="johndoe">
        </div>
      </div>

      <div class="field-group">
        <label for="email">Email</label>
        <div class="input-wrap">
          <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          <input id="email" type="email" formControlName="email" placeholder="john@example.com">
        </div>
      </div>

      <div class="field-group">
        <label for="password">Password</label>
        <div class="input-wrap">
          <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
          <input id="password" type="password" formControlName="password" placeholder="Min 6 characters">
        </div>
      </div>

      <button type="submit" class="btn-primary submit-btn" [disabled]="loading || registerForm.invalid">
        @if (loading) {
          <span class="spinner"></span> Creating account…
        } @else {
          Create Account
        }
      </button>
    </form>

    <div class="auth-footer">
      Already have an account? <a routerLink="/login" class="auth-link">Sign in</a>
    </div>
  </div>
</div>
