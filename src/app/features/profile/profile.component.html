<div class="profile-container">
  @if (user) {
    <div class="card profile-header">
      <div class="avatar large">{{ user.username.charAt(0).toUpperCase() }}</div>
      <div class="profile-info">
        <h1>{{ user.fullName || user.username }}</h1>
        <p class="username">&#64;{{ user.username }}</p>
        <span class="chip">{{ user.role }}</span>
      </div>
      <div class="profile-actions">
        <button class="btn-secondary">Edit Profile</button>
      </div>
    </div>
  } @else {
    <div class="status">Loading profile...</div>
  }
</div>
