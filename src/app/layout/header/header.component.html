<header class="navbar">
  <div class="navbar-inner">

    <a routerLink="/feed" class="logo">
      <div class="logo-mark">
        <span>🌐</span>
      </div>
      <span class="logo-text gradient-text">ConnectSphere</span>
    </a>

    <div class="nav-center">
      <a routerLink="/feed" class="nav-pill" [class.active]="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>Home</span>
      </a>
      <a routerLink="/search" class="nav-pill">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <span>Explore</span>
      </a>
      <a routerLink="/notifications" class="nav-pill">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
        <span>Alerts</span>
      </a>
    </div>

    <div class="nav-right">
      @if (user) {
        <a routerLink="/profile" class="user-pill">
          <div class="user-avatar">{{ user.username.charAt(0).toUpperCase() }}</div>
          <span class="user-name">{{ user.username }}</span>
        </a>
      }
      <button (click)="logout()" class="logout-btn" title="Logout">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>

  </div>
</header>
